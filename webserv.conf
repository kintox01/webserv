# Fichier de configuration webserv
# Syntaxe inspiree de nginx

server {
    listen 8080;
    server_name localhost;

    # Pages d'erreur personnalisees
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Taille max du corps d'une requete (upload)
    client_max_body_size 10M;

    # Route principale : servir les fichiers statiques
    location / {
        root ./www;
        index index.html;
        methods GET HEAD;
        autoindex off;
    }

    # Upload de fichiers via POST
    location /upload {
        root ./www/uploads;
        methods GET POST DELETE;
        upload_store ./www/uploads;
        autoindex on;
    }

    # Scripts CGI Python
    location /cgi-bin {
        root ./www/cgi-bin;
        methods GET POST;
        cgi .py /usr/bin/python3;
    }
}

